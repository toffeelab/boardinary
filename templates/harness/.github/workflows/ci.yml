name: CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: {{LINT_CMD}}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: {{TYPE_CHECK_CMD}}

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # TODO: Add your database service here
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: {{TEST_CMD}}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: {{BUILD_CMD}}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.result == 'success'
    services:
      # TODO: Add your database service here
    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'e2e/**'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.app == 'true'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.app == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.app == 'true'

      - run: {{E2E_CMD}}
        if: steps.filter.outputs.app == 'true'
